<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つかさに相談する</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f2f8fc;
    --navy:#12233f;
    --navy-soft:#3a5170;
    --blue:#0b7fd1;
    --blue-deep:#0a5d9c;
    --blue-pale:#eaf5fd;
    --blue-line:#c7e3f5;
    --text:#28313d;
    --text-muted:#5c6c7c;
    --text-dim:#8b98a6;
    --line:#e1eaf1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--bg);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--text);
    position:relative;
  }
  .display{font-family:'Zen Kaku Gothic New',sans-serif;}

  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      linear-gradient(180deg, var(--bg) 0%, var(--bg) 62%, var(--bg-soft) 100%);
  }
  body::after{
    content:"";
    position:fixed; top:0; left:0; right:0; height:5px; z-index:2; pointer-events:none;
    background:linear-gradient(90deg, var(--blue) 0%, #5fc2f2 50%, var(--blue) 100%);
  }

  .wrap{max-width:640px; margin:0 auto; padding:64px 20px 120px; position:relative; z-index:1;}

  header{text-align:center; margin-bottom:40px;}
  .eyebrow{
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:12px; letter-spacing:.32em;
    color:var(--blue); font-weight:700; margin-bottom:12px;
  }
  .logo{
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:40px;
    letter-spacing:.02em; margin:0 0 12px; color:var(--navy);
  }
  .logo span{color:var(--blue);}
  .tagline{color:var(--text-muted); font-size:14.5px; line-height:1.85; margin:0;}

  .progress{display:flex; justify-content:center; gap:8px; margin:28px 0 40px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line); transition:all .4s;}
  .dot.done{background:var(--blue);}
  .dot.active{background:var(--blue); width:22px; border-radius:5px;}

  .turn{margin-bottom:14px;}
  .bubble{
    display:flex; gap:12px; align-items:flex-start; margin-bottom:18px;
    animation:fadein .45s ease both;
  }
  @keyframes fadein{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .avatar{
    flex:0 0 auto; width:38px;height:38px;border-radius:50%;
    background:var(--blue);
    display:flex;align-items:center;justify-content:center;
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; color:#fff; font-size:15px;
  }
  .say{
    background:var(--bg-soft); border:1px solid var(--line);
    padding:16px 20px; border-radius:2px 16px 16px 16px;
    font-size:16px; line-height:1.9; max-width:480px;
  }
  .say strong{color:var(--navy); font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700;}
  .say .small{display:block; font-size:13px; color:var(--text-muted); margin-top:4px;}

  .answer-area{margin-left:50px; animation:fadein .45s ease .1s both;}

  .cloud-field{display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 16px;}
  .tag{
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:500; font-size:14.5px;
    padding:10px 18px; border-radius:6px; cursor:pointer; user-select:none;
    background:#fff; border:1px solid var(--blue-line); color:var(--navy-soft);
    transition:background .2s, border-color .2s, color .2s;
  }
  .tag:hover{border-color:var(--blue);}
  .tag.picked{background:var(--blue); color:#fff; border-color:var(--blue); font-weight:700;}
  .tag.disabled{opacity:.35; cursor:not-allowed;}
  .counter{font-size:12.5px; color:var(--text-dim); margin-bottom:6px;}

  .btn-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:6px;}
  .choice-btn{
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:15px;
    padding:13px 22px; border-radius:8px; cursor:pointer;
    background:#fff; border:1px solid var(--blue-line); color:var(--navy);
    transition:all .2s; text-align:left;
  }
  .choice-btn:hover{border-color:var(--blue); background:var(--blue-pale);}
  .choice-btn.selected{background:var(--blue); color:#fff; border-color:var(--blue);}
  .choice-btn.disabled{opacity:.35; cursor:not-allowed; pointer-events:none;}

  .price-card{
    display:flex; flex-direction:column; gap:2px;
    min-width:150px;
  }
  .price-line{font-size:13.5px;}
  .price-strike{text-decoration:line-through; opacity:.6;}
  .price-free{font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; color:var(--blue-deep);}
  .price-note{font-size:11.5px; opacity:.85; margin-top:2px;}
  .choice-btn.selected .price-free{color:#fff;}
  .choice-btn.selected .price-note{color:#fff; opacity:.85;}

  input.field{
    width:100%; font-family:'Noto Sans JP',sans-serif; font-size:16px;
    padding:14px 16px; border-radius:8px; border:1px solid var(--blue-line);
    background:#fff; color:var(--text); outline:none; margin-bottom:12px;
  }
  input.field::placeholder{color:var(--text-dim);}
  input.field:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(11,127,209,.12);}

  .next-btn{
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:15px;
    padding:12px 30px; border-radius:8px; border:none; cursor:pointer;
    background:var(--blue); color:#fff; margin-top:8px;
    transition:background .15s, box-shadow .15s;
  }
  .next-btn:hover{background:var(--blue-deep); box-shadow:0 4px 14px rgba(11,127,209,.28);}
  .next-btn:disabled{opacity:.35; cursor:not-allowed; box-shadow:none;}

  .recap{
    margin-left:50px; margin-bottom:22px; font-size:13.5px; color:var(--text-muted);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .recap b{color:var(--navy); font-weight:700;}
  .recap-edit{
    font-size:12px; color:var(--blue); cursor:pointer; text-decoration:underline; background:none; border:none; font-family:inherit; padding:0;
  }

  .hint{font-size:12.5px; color:var(--text-dim); margin-top:2px;}

  .thanks{
    text-align:center; padding:60px 20px; animation:fadein .5s ease both;
  }
  .thanks .check{
    width:60px;height:60px;border-radius:50%;background:var(--blue); margin:0 auto 22px;
    display:flex;align-items:center;justify-content:center;
  }
  .thanks h2{font-family:'Zen Kaku Gothic New',sans-serif; margin:0 0 12px; font-size:22px; color:var(--navy);}
  .thanks p{color:var(--text-muted); line-height:1.9; font-size:15px;}

  @media (max-width:480px){
    .logo{font-size:32px;}
    .say{max-width:100%;}
    .answer-area, .recap{margin-left:0;}
  }

  @media (prefers-reduced-motion: reduce){
    .bubble, .answer-area, .thanks{animation:none !important;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">TALK WITH</div>
    <h1 class="logo">つかさ<span>に相談する</span></h1>
    <p class="tagline">SNS、仕事、お金、人間関係──<br>多岐にわたって相談できます。<br>まずは軽く、話してみませんか。</p>
  </header>

  <div class="progress" id="progress"></div>

  <div id="flow"></div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxZ3lharri-IkPmVsYcsDdGRCkseAAuTP7sfbUZqX9Sz62KAOHU-DR5BDGuTdc8MBv/exec";

const TOPICS = ["SNS運用","コミュニティ","スモールビジネス","戦略設計","営業","マーケティング","ブランディング","イベント企画","クリエイティブ","キャリア","考え方","人間関係","コミュニケーション","生き方","お金"];
const MAX_TOPICS = 5;

const state = {
  topics: [],
  metBefore: null,
  duration: null,
  igId: "",
  displayName: "",
};

const flowEl = document.getElementById('flow');
const progressEl = document.getElementById('progress');
const STEP_COUNT = 5;
let currentStep = 1;
let completedThrough = 0;

function renderProgress(){
  progressEl.innerHTML = '';
  for(let i=1;i<=STEP_COUNT;i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i < currentStep ? ' done' : '') + (i === currentStep ? ' active' : '');
    progressEl.appendChild(d);
  }
}

function bubble(html){
  return `<div class="bubble"><div class="avatar">つ</div><div class="say">${html}</div></div>`;
}

function goToStep(n){
  currentStep = n;
  renderProgress();
  renderFlow();
  setTimeout(()=>window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'}), 80);
}

function renderFlow(){
  flowEl.innerHTML = '';

  if(currentStep > 1){
    flowEl.innerHTML += `<div class="recap">相談したいテーマ: <b>${state.topics.join('、')}</b>
      <button class="recap-edit" onclick="goToStep(1)">変更する</button></div>`;
  } else {
    flowEl.innerHTML += bubble(`<strong>多岐にわたって相談できます！</strong><span class="small">気になるテーマを、最大5つまで選んでください。</span>`);
    let cloud = `<div class="answer-area">
      <div class="counter" id="topic-counter">0 / ${MAX_TOPICS} 選択中</div>
      <div class="cloud-field" id="cloud-field">
        ${TOPICS.map((t)=>`<span class="tag" data-t="${t}" onclick="toggleTopic('${t}')">${t}</span>`).join('')}
      </div>
      <button class="next-btn" id="topic-next" disabled onclick="confirmTopics()">次へ</button>
    </div>`;
    flowEl.innerHTML += cloud;
    refreshTopicUI();
  }

  if(currentStep < 2) return;

  if(currentStep > 2){
    flowEl.innerHTML += `<div class="recap">つかさと会ったこと: <b>${state.metBefore ? 'ある(知り合い)' : 'はじめて'}</b>
      <button class="recap-edit" onclick="goToStep(2)">変更する</button></div>`;
  } else {
    flowEl.innerHTML += bubble(`<strong>つかさとお会いしたことはありますか？</strong>`);
    flowEl.innerHTML += `<div class="answer-area">
      <div class="btn-row">
        <button class="choice-btn ${state.metBefore===true?'selected':''}" onclick="setMet(true)">はい、会ったことがあります</button>
        <button class="choice-btn ${state.metBefore===false?'selected':''}" onclick="setMet(false)">いいえ、はじめてです</button>
      </div>
    </div>`;
    return;
  }

  if(currentStep > 3){
    flowEl.innerHTML += `<div class="recap">初回セッション: <b>${state.duration}分</b>
      <button class="recap-edit" onclick="goToStep(3)">変更する</button></div>`;
  } else {
    flowEl.innerHTML += bubble(`<strong>初回のセッション時間はどれにしますか？</strong>`);
    flowEl.innerHTML += `<div class="answer-area"><div class="btn-row" id="duration-row"></div></div>`;
    flowEl.innerHTML += renderDurationOptions();
    return;
  }

  if(currentStep > 4){
    flowEl.innerHTML += `<div class="recap">Instagram ID: <b>@${state.igId}</b>
      <button class="recap-edit" onclick="goToStep(4)">変更する</button></div>`;
  } else {
    flowEl.innerHTML += bubble(`<strong>ビデオ通話はInstagramの機能を使います。</strong><span class="small">当日ご連絡できるよう、InstagramのIDを教えてください。</span>`);
    flowEl.innerHTML += `<div class="answer-area">
      <input class="field" id="ig-input" placeholder="@なしのIDのみでOK" value="${state.igId}">
      <button class="next-btn" id="ig-next" onclick="confirmIg()">次へ</button>
    </div>`;
    setTimeout(()=>{
      const inp = document.getElementById('ig-input');
      inp.addEventListener('input', ()=>{ document.getElementById('ig-next').disabled = inp.value.trim()===''; });
      inp.dispatchEvent(new Event('input'));
    },0);
    return;
  }

  if(currentStep > 5){
  } else {
    flowEl.innerHTML += bubble(`<strong>当日、お呼びするお名前を教えてください。</strong><span class="small">ニックネームでも大丈夫です。</span>`);
    flowEl.innerHTML += `<div class="answer-area">
      <input class="field" id="name-input" placeholder="例）ゆか" value="${state.displayName}">
      <button class="next-btn" id="name-next" onclick="submitAll()">送信</button>
    </div>`;
    setTimeout(()=>{
      const inp = document.getElementById('name-input');
      inp.addEventListener('input', ()=>{ document.getElementById('name-next').disabled = inp.value.trim()===''; });
      inp.dispatchEvent(new Event('input'));
    },0);
    return;
  }
}

function toggleTopic(t){
  const idx = state.topics.indexOf(t);
  if(idx>-1){
    state.topics.splice(idx,1);
  } else {
    if(state.topics.length >= MAX_TOPICS) return;
    state.topics.push(t);
  }
  refreshTopicUI();
}
function refreshTopicUI(){
  const field = document.getElementById('cloud-field');
  if(!field) return;
  document.querySelectorAll('.tag').forEach(el=>{
    const t = el.dataset.t;
    const picked = state.topics.includes(t);
    el.classList.toggle('picked', picked);
    el.classList.toggle('disabled', !picked && state.topics.length>=MAX_TOPICS);
  });
  document.getElementById('topic-counter').textContent = `${state.topics.length} / ${MAX_TOPICS} 選択中`;
  document.getElementById('topic-next').disabled = state.topics.length===0;
}
function confirmTopics(){
  if(state.topics.length===0) return;
  goToStep(2);
}

function setMet(val){
  state.metBefore = val;
  state.duration = null;
  goToStep(3);
}

const DURATIONS = [
  { min:30, priceFirst:null,  priceMet:0 },
  { min:60, priceFirst:5000,  priceMet:5000 },
  { min:90, priceFirst:8800,  priceMet:8800 },
];

function renderDurationOptions(){
  const isMet = state.metBefore === true;
  const rows = DURATIONS.map(d=>{
    const availableForFirst = d.priceFirst !== null;
    const disabled = !isMet && !availableForFirst;
    const selected = state.duration === d.min;
    let priceHtml = '';
    if(isMet){
      if(d.min === 30){
        priceHtml = `<span class="price-free">0円</span><span class="price-note">知り合い特典</span>`;
      } else {
        priceHtml = `<span class="price-line price-strike">${d.priceFirst.toLocaleString()}円</span><span class="price-free">知り合いのため0円にします</span>`;
      }
    } else {
      priceHtml = disabled
        ? `<span class="price-note">はじめての方は60分・90分から選べます</span>`
        : `<span class="price-line">${d.priceFirst.toLocaleString()}円</span>`;
    }
    return `<button class="choice-btn ${selected?'selected':''} ${disabled?'disabled':''}"
              onclick="${disabled?'':`setDuration(${d.min})`}">
              <div class="price-card">
                <span style="font-size:16px;">${d.min}分</span>
                ${priceHtml}
              </div>
            </button>`;
  }).join('');
  return `<div class="btn-row">${rows}</div>`;
}

function setDuration(min){
  state.duration = min;
  goToStep(4);
}

function confirmIg(){
  const inp = document.getElementById('ig-input');
  const val = inp.value.trim().replace(/^@/, '');
  if(!val) return;
  state.igId = val;
  goToStep(5);
}

async function submitAll(){
  const inp = document.getElementById('name-input');
  const val = inp.value.trim();
  if(!val) return;
  state.displayName = val;

  const entry = {
    topics: state.topics,
    metBefore: state.metBefore,
    duration: state.duration,
    price: state.metBefore ? 0 : (DURATIONS.find(d=>d.min===state.duration)?.priceFirst ?? null),
    igId: state.igId,
    displayName: state.displayName,
    submittedAt: new Date().toISOString(),
  };

  try{
    if(APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes('ここに')){
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(entry),
      });
    } else {
      console.warn('APPS_SCRIPT_URL が未設定のため、スプレッドシートには送信されていません。');
    }
  }catch(e){
    console.error('送信に失敗しました', e);
  }

  currentStep = 6;
  renderProgress();
  showThanks();
  setTimeout(()=>window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'}), 80);
}

function showThanks(){
  flowEl.innerHTML += `
    <div class="thanks">
      <div class="check">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M4 12.5L9.5 18L20 6" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="display">送信しました</h2>
      <p>Instagramからご連絡しますので、<br>そのままお待ちください。</p>
    </div>`;
}

renderProgress();
renderFlow();
</script>
</body>
</html>
